<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic job search and resume tailoring workflow</title>
  <desc id="desc">A human-in-the-loop workflow from verified candidate data and job description through structured generation, validation, review, and visible browser assistance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c001e"/>
      <stop offset="1" stop-color="#151116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e95420"/>
      <stop offset="1" stop-color="#c65d3b"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <path d="M0 72h1600" stroke="#6b4160" stroke-width="2"/>
  <circle cx="36" cy="36" r="10" fill="#e95420"/><circle cx="68" cy="36" r="10" fill="#777077"/><circle cx="100" cy="36" r="10" fill="#777077"/>
  <text x="800" y="45" fill="#f7f2f5" font-family="Ubuntu, Arial, sans-serif" font-size="24" text-anchor="middle">agentic-job-search / workflow.architecture</text>
  <text x="90" y="152" fill="#f7f2f5" font-family="Ubuntu, Arial, sans-serif" font-size="48" font-weight="700">HUMAN-IN-THE-LOOP AUTOMATION</text>
  <text x="92" y="194" fill="#aea79f" font-family="Ubuntu Mono, Consolas, monospace" font-size="21">grounded inputs → structured generation → validation → explicit approval</text>
  <g filter="url(#shadow)" font-family="Ubuntu, Arial, sans-serif">
    <g transform="translate(82 285)"><rect width="270" height="190" rx="18" fill="#211c21" stroke="#704261" stroke-width="2"/><text x="28" y="48" fill="#e95420" font-size="18" font-family="Ubuntu Mono, Consolas, monospace">01 / INPUT</text><text x="28" y="91" fill="#fff" font-size="28" font-weight="700">Verified profile</text><text x="28" y="126" fill="#c8c3c7" font-size="20">Master resume</text><text x="28" y="158" fill="#c8c3c7" font-size="20">Job description</text></g>
    <g transform="translate(397 285)"><rect width="270" height="190" rx="18" fill="#211c21" stroke="#704261" stroke-width="2"/><text x="28" y="48" fill="#e95420" font-size="18" font-family="Ubuntu Mono, Consolas, monospace">02 / GENERATE</text><text x="28" y="91" fill="#fff" font-size="28" font-weight="700">LLM workflow</text><text x="28" y="126" fill="#c8c3c7" font-size="20">Role-specific content</text><text x="28" y="158" fill="#c8c3c7" font-size="20">Structured JSON</text></g>
    <g transform="translate(712 285)"><rect width="270" height="190" rx="18" fill="#211c21" stroke="#704261" stroke-width="2"/><text x="28" y="48" fill="#e95420" font-size="18" font-family="Ubuntu Mono, Consolas, monospace">03 / VALIDATE</text><text x="28" y="91" fill="#fff" font-size="28" font-weight="700">Safety checks</text><text x="28" y="126" fill="#c8c3c7" font-size="20">Known-field matching</text><text x="28" y="158" fill="#c8c3c7" font-size="20">Grounded claims</text></g>
    <g transform="translate(1027 285)"><rect width="270" height="190" rx="18" fill="#211c21" stroke="#e95420" stroke-width="3"/><text x="28" y="48" fill="#e95420" font-size="18" font-family="Ubuntu Mono, Consolas, monospace">04 / APPROVE</text><text x="28" y="91" fill="#fff" font-size="28" font-weight="700">Human review</text><text x="28" y="126" fill="#c8c3c7" font-size="20">Edit or reject</text><text x="28" y="158" fill="#c8c3c7" font-size="20">Explicit consent</text></g>
    <g transform="translate(1342 285)"><rect width="176" height="190" rx="18" fill="#211c21" stroke="#704261" stroke-width="2"/><text x="22" y="48" fill="#e95420" font-size="18" font-family="Ubuntu Mono, Consolas, monospace">05 / ASSIST</text><text x="22" y="91" fill="#fff" font-size="25" font-weight="700">Visible</text><text x="22" y="122" fill="#fff" font-size="25" font-weight="700">browser</text><text x="22" y="158" fill="#c8c3c7" font-size="18">No auto-submit</text></g>
  </g>
  <g stroke="url(#accent)" stroke-width="5" fill="none"><path d="M352 380h45"/><path d="M667 380h45"/><path d="M982 380h45"/><path d="M1297 380h45"/></g>
  <g fill="#e95420"><path d="m390 370 15 10-15 10z"/><path d="m705 370 15 10-15 10z"/><path d="m1020 370 15 10-15 10z"/><path d="m1335 370 15 10-15 10z"/></g>
  <rect x="82" y="555" width="1436" height="220" rx="20" fill="#181518" stroke="#4f3349" stroke-width="2"/>
  <text x="120" y="610" fill="#e95420" font-family="Ubuntu Mono, Consolas, monospace" font-size="20">SAFETY BOUNDARIES</text>
  <g font-family="Ubuntu, Arial, sans-serif" font-size="25" fill="#f7f2f5"><text x="120" y="666">✓ Credentials and browser profile remain local</text><text x="120" y="716">✓ Every generated claim remains reviewable</text><text x="810" y="666">✓ Conservative visible-field matching</text><text x="810" y="716">✓ No automatic application submission</text></g>
  <text x="82" y="840" fill="#8ae234" font-family="Ubuntu Mono, Consolas, monospace" font-size="21">user@portfolio:~$ status --prototype --private --in-progress</text>
</svg>
